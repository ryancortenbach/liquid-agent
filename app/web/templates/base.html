<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="2">
<title>{% block title %}Liquid{% endblock %}</title>
<style>
  :root { --ink:#141922; --muted:#5c6774; --hair:#dce2ea; --bg:#f3f5f8; --surface:#fff; --accent:#1877f2; --red:#b3261e; --amber:#b8661a; --good:#1e7f4f; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  header h1 { margin:0; font-size:22px; } header .clock { color:var(--muted); font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns: 1fr 1.4fr; gap:16px; }
  .panel { background:var(--surface); border:1px solid var(--hair); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .panel h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  table { border-collapse:collapse; width:100%; font-size:14px; } td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--hair); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--hair); color:var(--muted); margin-left:6px; }
  .badge.live, .badge.published, .badge.approved { color:var(--good); border-color:var(--good); }
  .badge.failed, .badge.rejected { color:var(--red); border-color:var(--red); }
  .badge.handoff_ready, .badge.review { color:var(--amber); border-color:var(--amber); }
  pre.card { background:#eaeff5; border-radius:8px; padding:12px; white-space:pre-wrap; font:13.5px/1.45 ui-monospace, Menlo, monospace; margin:0; }
  .photos { display:flex; gap:10px; flex-wrap:wrap; } .photos figure { margin:0; width:180px; } .photos img { width:100%; border-radius:6px; border:1px solid var(--hair); }
  .photos figcaption { font-size:12px; color:var(--muted); }
  .ledger td.reason { color:var(--ink); } .ledger .kind { color:var(--muted); font-size:12px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .big { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
</style>
</head>
<body><div class="wrap">
<header><h1><a href="/dashboard">Liquid</a> {% block crumb %}{% endblock %}</h1><span class="clock">sim {{ clock.strftime("%a %H:%M") }}</span></header>
{% block content %}{% endblock %}
</div></body></html>
