[project]
name = "liquid-agent"
version = "0.1.0"
description = "Seller-only photo and marketplace agent for the Multi-App AI Agent Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0",
  "dateparser>=1.2.2",
  "fastapi>=0.116.0",
  "jinja2>=3.1.6",
  "openai>=2.0.0",
  "pillow>=11.3.0",
  "pillow-heif>=1.1.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "python-ulid>=3.0.0",
  "sqlmodel>=0.0.24",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
integrations = [
  "anthropic>=0.66.0",
  "google-api-python-client>=2.180.0",
  "google-auth-oauthlib>=1.2.2",
  "httpx>=0.28.0",
  "numpy>=2.3.0",
  "pyyaml>=6.0.2",
  "shippo>=3.9.0",
  "sse-starlette>=3.0.2",
  "tenacity>=9.1.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138.0",
  "httpx>=0.28.0",
  "matplotlib>=3.10.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
